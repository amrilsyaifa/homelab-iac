apiVersion: apps/v1
kind: Deployment

metadata:
  name: landing
  namespace: balasiq

spec:
  replicas: 1

  selector:
    matchLabels:
      app: balasiq-landing

  template:
    metadata:
      labels:
        app: balasiq-landing

    spec:
      containers:
        - name: landing
          image: registry.home.arpa:5000/balasiq/landing:0.1.0

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"

            limits:
              cpu: "150m"
              memory: "128Mi"

          startupProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 10
            failureThreshold: 3