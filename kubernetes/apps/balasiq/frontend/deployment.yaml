apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: balasiq

spec:
  replicas: 1

  selector:
    matchLabels:
      app: balasiq-frontend

  template:
    metadata:
      labels:
        app: balasiq-frontend

    spec:
      containers:
        - name: frontend
          image: registry.home.arpa:5000/balasiq/frontend:0.1.0

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80

            periodSeconds: 10
            failureThreshold: 3