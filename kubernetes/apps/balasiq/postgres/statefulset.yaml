apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: balasiq

spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: balasiq-postgres

  template:
    metadata:
      labels:
        app: balasiq-postgres

    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17

          ports:
            - name: postgres
              containerPort: 5432

          envFrom:
            - secretRef:
                name: balasiq-postgres-secret

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/000_roles.sql
              subPath: 000_roles.sql
              readOnly: true

      volumes:
        - name: postgres-init
          configMap:
            name: balasiq-postgres-init

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: local-path

        resources:
          requests:
            storage: 5Gi