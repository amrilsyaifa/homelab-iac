apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: balasiq
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/amrilsyaifa/homelab-iac.git
    targetRevision: main
    path: environments/staging/balasiq

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: balasiq

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false