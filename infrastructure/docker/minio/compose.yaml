name: homelab-minio

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - :9001

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    networks:
      - homelab

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

volumes:
  minio_data:
    name: minio_data

networks:
  homelab:
    external: true