replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent

service:
  enable: true
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
    
env:
  - name: APP_ENV
    value: development

  - name: LOG_LEVEL
    value: info